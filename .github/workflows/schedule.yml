name: Random Quote Scheduler

on:
  repository_dispatch:
    types: [schedule_quotes]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: random-quote-scheduler
  cancel-in-progress: false

jobs:
  schedule-quotes:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. 获取仓库
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==============================
      # 2. 安装 Python
      # ==============================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==============================
      # 3. 安装 requests
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==============================
      # 4. 设置 X Cookie
      # ==============================
      - name: Configure X session
        env:
          X_COOKIE: ${{ secrets.X_COOKIE }}
        run: |
          echo "X Cookie 已加载。"

      # ==============================
      # 5. 随机语录排程
      # ==============================
      - name: Schedule random quotes
        env:
          X_COOKIE: ${{ secrets.X_COOKIE }}
        run: |
          python quote_poster.py

      # ==============================
      # 6. 保存排程状态
      # ==============================
      - name: Save schedule state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add quote_schedule_state.json

          if git diff --cached --quiet; then
            echo "没有新的 state 修改，不需要提交。"
          else
            git commit -m "Update quote schedule state"
            git push
          fi
