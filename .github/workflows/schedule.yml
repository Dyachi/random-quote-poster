name: Random Quote Scheduler

on:
  schedule:
    # 每天北京时间 00:05 运行
    # 台湾 UTC+8，所以这里是 16:05 UTC
    - cron: "5 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: random-quote-scheduler
  cancel-in-progress: false

jobs:
  schedule-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tweetkit-x
        run: |
          python -m pip install --upgrade pip
          pip install tweetkit-x

      - name: Configure X session
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_TWID: ${{ secrets.TWID }}
          X_KDT: ${{ secrets.KDT }}
          X_GUEST_ID: ${{ secrets.GUEST_ID }}
          X_PERSONALIZATION_ID: ${{ secrets.PERSONALIZATION_ID }}
        run: |
          mkdir -p ~/.config/tweetkit
          
          printf 'auth_token=%s; ct0=%s; twid=%s; kdt=%s; guest_id=%s; personalization_id=%s\n' \
            "$X_AUTH_TOKEN" \
            "$X_CT0" \
            "$X_TWID" \
            "$X_KDT" \
            "$X_GUEST_ID" \
            "$X_PERSONALIZATION_ID" \
            > ~/.config/tweetkit/cookie.txt
        
          chmod 600 ~/.config/tweetkit/cookie.txt

      - name: Check X login
        run: |
          tweetkit whoami

      - name: Schedule random quotes
        run: |
          python quote_poster.py

      - name: Save schedule state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add quote_schedule_state.json

          if git diff --cached --quiet; then
            echo "没有新的 state 修改，不需要提交。"
          else
            git commit -m "Update quote schedule state"
            git push
          fi
