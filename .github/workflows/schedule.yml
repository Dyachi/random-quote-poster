name: Test X Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-x:
    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. 获取仓库
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # 3. 安装 Playwright
      # ============================================================

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright


      # ============================================================
      # 4. 安装 Chromium
      # ============================================================

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ============================================================
      # 5. 测试 X
      # ============================================================

      - name: Test X
        env:
          X_COOKIE: ${{ secrets.X_COOKIE }}

        run: |

          python - <<'PY'

          import os
          from playwright.sync_api import sync_playwright

          cookie = os.environ.get("X_COOKIE", "")

          print("===================================")
          print("X CONNECTION TEST")
          print("===================================")

          print(
              "X_COOKIE 已加载：",
              "YES" if cookie else "NO"
          )

          print()

          if not cookie:
              raise RuntimeError(
                  "没有读取到 X_COOKIE"
              )

          # --------------------------------------------------------
          # 解析 Cookie
          # --------------------------------------------------------

          cookies = []

          for item in cookie.split(";"):

              item = item.strip()

              if "=" not in item:
                  continue

              name, value = item.split("=", 1)

              cookies.append({
                  "name": name.strip(),
                  "value": value.strip(),
                  "domain": ".x.com",
                  "path": "/"
              })

          print(
              "Cookie 数量：",
              len(cookies)
          )

          print()

          # --------------------------------------------------------
          # 启动 Chromium
          # --------------------------------------------------------

          with sync_playwright() as p:

              print("启动 Chromium...")
              print()

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context()

              context.add_cookies(cookies)

              page = context.new_page()

              print("正在访问 X...")
              print()

              response = page.goto(
                  "https://x.com/home",
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              if response:
                  print(
                      "HTTP 状态：",
                      response.status
                  )

              print(
                  "最终 URL：",
                  page.url
              )

              print(
                  "页面标题：",
                  page.title()
              )

              print()

              # ----------------------------------------------------
              # 判断结果
              # ----------------------------------------------------

              title = page.title().lower()
              url = page.url.lower()

              if (
                  "just a moment" in title
                  or "challenge" in url
                  or "captcha" in url
              ):

                  print("❌ X 返回了 Cloudflare / 验证页面")

              elif "login" in url:

                  print("⚠️ X 要求登录")

              elif "home" in url:

                  print("✅ X 首页可以正常访问")

              else:

                  print(
                      "⚠️ X 返回了未知页面"
                  )

              # ----------------------------------------------------
              # 截取页面文字
              # ----------------------------------------------------

              try:

                  text = page.locator(
                      "body"
                  ).inner_text(
                      timeout=10000
                  )

                  print()
                  print("===================================")
                  print("页面前 1000 个字符")
                  print("===================================")
                  print(text[:1000])

              except Exception as e:

                  print(
                      "无法读取页面文字：",
                      e
                  )

              browser.close()

          print()
          print("===================================")
          print("测试结束")
          print("===================================")

          PY
