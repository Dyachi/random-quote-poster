name: Random Quote Scheduler

on:
  repository_dispatch:
    types: [schedule_quotes]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: random-quote-scheduler
  cancel-in-progress: false

jobs:
  schedule-quotes:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. 获取仓库
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # 3. 安装 Playwright
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright


      # ============================================================
      # 4. 安装 Chromium
      # ============================================================

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ============================================================
      # 5. 检查 Cookie
      #
      # 只显示 Cookie 名称
      # 不显示 Cookie 内容
      # ============================================================

      - name: Check X cookie
        env:
          X_COOKIE: ${{ secrets.X_COOKIE }}

        run: |

          python - <<'PY'

          import os

          cookie = os.environ.get(
              "X_COOKIE",
              ""
          )

          names = []

          for item in cookie.split(";"):

              item = item.strip()

              if "=" in item:

                  name = item.split(
                      "=",
                      1
                  )[0].strip()

                  names.append(name)

          print("===================================")
          print("X COOKIE CHECK")
          print("===================================")

          print(
              "X_COOKIE 已加载：",
              "YES" if cookie else "NO"
          )

          print()

          print(
              "auth_token:",
              "YES"
              if "auth_token" in names
              else "NO"
          )

          print(
              "ct0:",
              "YES"
              if "ct0" in names
              else "NO"
          )

          print(
              "twid:",
              "YES"
              if "twid" in names
              else "NO"
          )

          print("===================================")

          PY


      # ============================================================
      # 6. 运行排程
      # ============================================================

      - name: Schedule random quotes
        env:
          X_COOKIE: ${{ secrets.X_COOKIE }}

        run: |

          python quote_poster.py


      # ============================================================
      # 7. 保存状态
      # ============================================================

      - name: Save schedule state
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add quote_schedule_state.json

          if git diff --cached --quiet; then

            echo "没有新的 state 修改，不需要提交。"

          else

            git commit \
              -m "Update quote schedule state"

            git push

          fi
