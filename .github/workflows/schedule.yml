name: Schedule Test

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test trigger
        run: |
          echo "==================================="
          echo "WORKFLOW TRIGGERED"
          echo "Event: ${{ github.event_name }}"
          echo "Time: $(date -u)"
          echo "==================================="
