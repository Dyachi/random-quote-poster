name: Test X Session

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tweetkit-x
        run: |
          python -m pip install --upgrade pip
          pip install tweetkit-x

      - name: Configure X session
        env:
          X_COOKIE: ${{ secrets.X_COOKIE }}
        run: |
          mkdir -p ~/.config/tweetkit
          printf '%s\n' "$X_COOKIE" > ~/.config/tweetkit/cookie.txt
          chmod 600 ~/.config/tweetkit/cookie.txt

      - name: Test X login
        run: |
          tweetkit whoami
