name: Test X Session

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tweetkit-x
        run: |
          python -m pip install --upgrade pip
          pip install tweetkit-x

      - name: Configure X session
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          mkdir -p ~/.config/tweetkit
          printf 'auth_token=%s; ct0=%s\n' "$X_AUTH_TOKEN" "$X_CT0" > ~/.config/tweetkit/cookie.txt
          chmod 600 ~/.config/tweetkit/cookie.txt

      - name: Test X login
        run: |
          tweetkit whoami
